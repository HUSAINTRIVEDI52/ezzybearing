<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none">
  <!-- Gear & Bearing Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Gear Teeth -->
    <path d="M 50 10 
             L 55 10 L 57 16 L 63 17 L 67 12 L 71 14 L 71 21 L 77 24 L 82 21 L 85 25 L 83 31 L 87 36 L 93 35 L 94 40 L 90 45 L 92 51 L 98 53 L 98 58 L 92 60 L 90 66 L 94 71 L 93 76 L 87 75 L 83 80 L 85 86 L 82 90 L 77 87 L 71 90 L 71 97 L 67 99 L 63 94 L 57 95 L 55 101 L 50 101 L 48 95 L 42 94 L 38 99 L 34 97 L 34 90 L 28 87 L 23 90 L 20 86 L 22 80 L 18 75 L 12 76 L 11 71 L 15 66 L 13 60 L 7 58 L 7 53 L 13 51 L 15 45 L 11 40 L 12 35 L 18 36 L 22 31 L 20 25 L 23 21 L 28 24 L 34 21 L 34 14 L 38 12 L 42 17 L 48 16 Z" 
          fill="#DFB155" stroke="#C89B3C" stroke-width="1.5"/>
    
    <!-- Bearing Outer Raceway -->
    <circle cx="52.5" cy="55.5" r="28" fill="#0F1B2B" stroke="#DFB155" stroke-width="2.5"/>
    <circle cx="52.5" cy="55.5" r="21" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Rolling Balls -->
    <circle cx="52.5" cy="34.5" r="4.2" fill="#FFFFFF"/>
    <circle cx="52.5" cy="76.5" r="4.2" fill="#FFFFFF"/>
    <circle cx="31.5" cy="55.5" r="4.2" fill="#FFFFFF"/>
    <circle cx="73.5" cy="55.5" r="4.2" fill="#FFFFFF"/>
    <circle cx="37.5" cy="40.5" r="3.8" fill="#DFB155"/>
    <circle cx="67.5" cy="40.5" r="3.8" fill="#DFB155"/>
    <circle cx="37.5" cy="70.5" r="3.8" fill="#DFB155"/>
    <circle cx="67.5" cy="70.5" r="3.8" fill="#DFB155"/>

    <!-- Inner Bore Ring -->
    <circle cx="52.5" cy="55.5" r="12" fill="#0F1B2B" stroke="#DFB155" stroke-width="2.5"/>
    <circle cx="52.5" cy="55.5" r="6" fill="#080E17"/>

    <!-- Dynamic Motion Waves Underneath -->
    <path d="M 12 96 C 30 84, 52 86, 70 94 C 82 100, 95 98, 105 92" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 22 104 C 40 92, 60 94, 80 102 C 92 107, 102 105, 112 100" stroke="#DFB155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 20)">
    <!-- Top Tagline -->
    <text x="0" y="16" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#DFB155">
      QUALITY &bull; PRECISION &bull; TRUST
    </text>

    <!-- Main Title EZZI -->
    <text x="0" y="52" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      EZZI <tspan fill="#DFB155">BEARING</tspan> SUPPLIERS
    </text>

    <!-- Stockist Subtitle -->
    <text x="2" y="74" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="6" fill="#94A3B8">
      STOCKIST &bull; MANMAD (MH)
    </text>
  </g>
</svg>
