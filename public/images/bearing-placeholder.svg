<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#F4F6FA" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4B94F" />
      <stop offset="100%" stop-color="#C9962B" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Outer Guide Grid -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Outer Ring -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#metalGrad)" stroke-width="24" />
  <circle cx="200" cy="180" r="132" fill="none" stroke="#0B1B3D" stroke-width="1" />
  <circle cx="200" cy="180" r="108" fill="none" stroke="#64748B" stroke-width="1" />

  <!-- Cage Ring -->
  <circle cx="200" cy="180" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85" />

  <!-- Precision Rolling Balls (8 balls) -->
  <g>
    <!-- 0 deg -->
    <circle cx="288" cy="180" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="284" cy="176" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 45 deg -->
    <circle cx="262.2" cy="242.2" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="258.2" cy="238.2" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 90 deg -->
    <circle cx="200" cy="268" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="196" cy="264" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 135 deg -->
    <circle cx="137.8" cy="242.2" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="133.8" cy="238.2" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 180 deg -->
    <circle cx="112" cy="180" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="108" cy="176" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 225 deg -->
    <circle cx="137.8" cy="117.8" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="133.8" cy="113.8" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 270 deg -->
    <circle cx="200" cy="92" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="196" cy="88" r="4" fill="#FFFFFF" opacity="0.8" />
    <!-- 315 deg -->
    <circle cx="262.2" cy="117.8" r="16" fill="#F8FAFC" stroke="#0B1B3D" stroke-width="2.5" />
    <circle cx="258.2" cy="113.8" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Inner Ring -->
  <circle cx="200" cy="180" r="60" fill="none" stroke="url(#metalGrad)" stroke-width="20" />
  <circle cx="200" cy="180" r="70" fill="none" stroke="#64748B" stroke-width="1" />
  <circle cx="200" cy="180" r="50" fill="none" stroke="#0B1B3D" stroke-width="1.5" />

  <!-- Center Bore -->
  <circle cx="200" cy="180" r="50" fill="#F1F5F9" />
  
  <!-- Subtle Center Crosshair -->
  <line x1="185" y1="180" x2="215" y2="180" stroke="#94A3B8" stroke-width="1" />
  <line x1="200" y1="165" x2="200" y2="195" stroke="#94A3B8" stroke-width="1" />

  <!-- Branded Badge Caption -->
  <rect x="70" y="332" width="260" height="34" rx="8" fill="#0B1B3D" stroke="#C9962B" stroke-width="1.5" />
  <text x="200" y="354" font-family="'Barlow Condensed', sans-serif" font-weight="900" font-size="14" fill="#E4B94F" text-anchor="middle" letter-spacing="2">
    EZZI BEARING SUPPLIERS
  </text>
</svg>
