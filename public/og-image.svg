<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Navy Background -->
  <rect width="1200" height="630" fill="#0B1B3D"/>
  
  <!-- Subtle Gear / Bearing Watermark Line-Art -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2" fill="none" transform="translate(750, 100)">
    <circle cx="200" cy="200" r="280" stroke-dasharray="24 16"/>
    <circle cx="200" cy="200" r="220" stroke="#E4B94F" stroke-width="4"/>
    <circle cx="200" cy="200" r="160"/>
    <circle cx="200" cy="200" r="90"/>
    <circle cx="200" cy="200" r="40"/>
    <!-- Radiating spokes -->
    <line x1="200" y1="-80" x2="200" y2="480"/>
    <line x1="-80" y1="200" x2="480" y2="200"/>
    <line x1="0" y1="0" x2="400" y2="400"/>
    <line x1="0" y1="400" x2="400" y2="0"/>
  </g>

  <!-- Left Side Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="36" rx="18" fill="#132752" stroke="#C9962B" stroke-width="1.5"/>
    <circle cx="24" cy="18" r="5" fill="#E4B94F"/>
    <text x="40" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#E4B94F" letter-spacing="1.5">
      STOCKIST • WHOLESALER • IMPORTER
    </text>
  </g>

  <!-- Title & Slogan -->
  <text x="80" y="200" font-family="'Barlow Condensed', 'Oswald', sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    EZZI BEARING SUPPLIERS
  </text>
  
  <text x="80" y="250" font-family="'Barlow Condensed', sans-serif" font-size="34" font-weight="700" fill="#E4B94F" letter-spacing="3">
    QUALITY • PRECISION • TRUST
  </text>

  <!-- Gold Divider with Diamond Motif -->
  <line x1="80" y1="285" x2="440" y2="285" stroke="#C9962B" stroke-width="2"/>
  <polygon points="450,285 456,279 462,285 456,291" fill="#E4B94F"/>
  <line x1="472" y1="285" x2="800" y2="285" stroke="#C9962B" stroke-width="2"/>

  <!-- Slogan -->
  <text x="80" y="340" font-family="'Inter', sans-serif" font-size="24" font-weight="500" fill="#F4F6FA">
    "All types of bearing solutions under one roof."
  </text>
  <text x="80" y="380" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#9FB3D8">
    Supplying Sugar Mills, Automotive Fleets, Railways, Agriculture &amp; Industrial Plants Across India
  </text>

  <!-- Brand Badges Strip -->
  <g transform="translate(80, 440)">
    <rect x="0" y="0" width="130" height="46" rx="8" fill="#132752" stroke="#253C6E"/>
    <text x="65" y="29" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">SKF</text>

    <rect x="150" y="0" width="130" height="46" rx="8" fill="#132752" stroke="#253C6E"/>
    <text x="215" y="29" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">TATA</text>

    <rect x="300" y="0" width="130" height="46" rx="8" fill="#132752" stroke="#253C6E"/>
    <text x="365" y="29" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">XNO</text>

    <rect x="450" y="0" width="130" height="46" rx="8" fill="#132752" stroke="#253C6E"/>
    <text x="515" y="29" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">DSF</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(80, 550)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
      Burhani Complex, Opp. Post Office, Manmad - 423104 (Dist. Nashik, MH)
    </text>
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#E4B94F">
      WhatsApp: +91 92723 95247 / +91 88307 21850 • Ready Depot Stock
    </text>
  </g>
</svg>
